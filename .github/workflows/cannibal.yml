name: GSC Cannibalization Check

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Số ngày lùi lấy dữ liệu GSC'
        default: '90'
      min_impr:
        description: 'Ngưỡng impressions tối thiểu của URL thứ 2'
        default: '10'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run GSC cannibalization check
        run: python cannibal_gsc.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          CANNIBAL_TAB: 'GSC Ăn Thịt'
          DAYS: ${{ github.event.inputs.days }}
          MIN_IMPR: ${{ github.event.inputs.min_impr }}
