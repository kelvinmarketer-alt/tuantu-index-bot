name: Index Check

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 07:00 giờ VN, mỗi ngày
  workflow_dispatch:           # cho phép bấm chạy tay

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run index bot
        run: python index_bot.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SITEMAP_URL: ${{ secrets.SITEMAP_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ secrets.SHEET_TAB }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_URLS: ${{ secrets.MAX_URLS }}
          DO_SUBMIT_INDEXING: 'true'
