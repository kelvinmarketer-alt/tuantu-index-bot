name: SEO Deep Audit

on:
  workflow_dispatch:
    inputs:
      crawl_delay:
        description: 'Giãn nhịp quét HTML (giây)'
        default: '0.6'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run SEO deep audit (chỉ đọc GSC + HTML công khai)
        run: python seo_deep.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          CRAWL_DELAY: ${{ github.event.inputs.crawl_delay }}
