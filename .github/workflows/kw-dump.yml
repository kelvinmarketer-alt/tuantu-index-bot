name: GSC KW Dump (encrypted)
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - run: python kw_dump.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          OUT: kw.json
      - name: Encrypt bằng khoá công khai (repo public — không để dữ liệu thô)
        run: |
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in kw.json -out kw.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey dump_pub.pem -in k.txt -out k.enc
          rm kw.json k.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kw-enc
          retention-days: 1
          path: |
            kw.enc
            k.enc
