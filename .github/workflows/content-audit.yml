name: GSC Content Audit

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Số ngày lùi lấy dữ liệu GSC'
        default: '90'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run GSC content audit
        run: python content_audit_gsc.py
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
          AUDIT_TAB: 'GSC Audit Bài'
          DAYS: ${{ github.event.inputs.days }}
